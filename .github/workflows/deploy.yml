# Deploy de FRIG web a Cloudflare Workers.
# Hosts: frig.yggdra.cl, www.frig.yggdra.cl e intranet.macanuobowl.cl.
# mani.agenciapatagoniachile.com no se publica.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   token con Workers Scripts + zonas yggdra.cl y macanuobowl.cl
#   CLOUDFLARE_ACCOUNT_ID  cuenta de Cloudflare
#   CLOUDFLARE_ZONE_ID     opcional; si está, se purga la caché al publicar
#
# El frontend se compila a HTML estático (output:"export").
# Apache usa out/.htaccess. Workers usa workers/asset-rewrites.js y out/_headers.

name: Deploy FRIG web

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_YGGDRA_API_BASE: "https://api.yggdra.cl/api"
      NEXT_PUBLIC_APP_BUILD: "${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generar tipos de rutas
        run: npx next typegen

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build estático
        run: npm run build

      - name: Generar .htaccess, _headers y rewrites
        run: node scripts/post-export.mjs

      - name: Verificar que el export trae cada chunk que referencia
        run: node scripts/verify-chunks.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: frig-out
          path: out/
          retention-days: 5
          include-hidden-files: true

  deploy-yggdra:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frig-out
          path: out/

      - name: Publicar FRIG en Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Purgar caché de la zona
        env:
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE" ]; then
            echo "Sin CLOUDFLARE_ZONE_ID: no se purga la caché."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
