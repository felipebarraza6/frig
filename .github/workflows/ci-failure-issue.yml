name: CI failure issue

on:
  workflow_run:
    workflows: ["CI", "Deploy FRIG web a FTP"]
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  sync-issue:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Abrir, comentar o cerrar issue de CI
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const label = 'ci-failure';
            const branch = run.head_branch || '(sin rama)';
            const title = `CI falló: ${run.name} en ${branch}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);

            if (run.conclusion === 'success') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `✅ El workflow **${run.name}** volvió a pasar en \`${branch}\` (commit \`${run.head_sha.slice(0, 7)}\`).\n\nEjecución: ${run.html_url}\n\nCierro este issue automáticamente.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const failed = jobs.filter(j => ['failure', 'timed_out', 'cancelled'].includes(j.conclusion));
            const jobLines = failed.length
              ? failed.map(j => {
                  const steps = (j.steps || []).filter(s => s.conclusion === 'failure').map(s => s.name);
                  return `- [${j.name}](${j.html_url})` + (steps.length ? ` — paso: ${steps.join(', ')}` : '');
                }).join('\n')
              : '- (no se pudieron identificar los jobs fallidos)';

            const actor = (run.triggering_actor && run.triggering_actor.login) || (run.actor && run.actor.login) || 'desconocido';
            const body = [
              `❌ Falló el workflow **${run.name}**.`,
              '',
              `- **Rama:** \`${branch}\``,
              `- **Commit:** \`${run.head_sha}\``,
              `- **Autor del disparo:** @${actor}`,
              `- **Evento:** ${run.event}`,
              `- **Ejecución:** ${run.html_url}`,
              '',
              '**Jobs fallidos:**',
              jobLines,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Volvió a fallar.\n\n${body}`,
              });
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd73a4a', description: 'Fallo de CI detectado automáticamente',
              });
            }

            await github.rest.issues.create({
              owner, repo, title, labels: [label],
              body: `${body}\n\n_Issue creado automáticamente. Se cerrará solo cuando el workflow vuelva a pasar en esta rama._`,
            });
